def onlineFlavors = ["colorballs", "reversi"]
def allFlavors = ["colorballs", "ballsremover", "dropcolorballs", "fivecolorballs", "reversi"]
def requestedTasks = gradle.startParameter.taskNames.collect { it.toLowerCase() }
def requestedFlavors = allFlavors.findAll { f -> requestedTasks.any { it.contains(f) } }
def needsOnlineLibs = requestedFlavors.isEmpty() || requestedFlavors.any { it in onlineFlavors }

