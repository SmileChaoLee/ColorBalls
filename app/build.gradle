def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { localProperties.load(it) }
}

def getSecretProperty = { String key ->
    println("System.getenv(key) = ${System.getenv(key)}")
    def value = System.getenv(key) ?: findProperty(key) ?: localProperties.getProperty(key)
    if (value != null) {
        value = value.trim()
        if ((value.startsWith('"') && value.endsWith('"')) || (value.startsWith("'") && value.endsWith("'"))) {
            value = value.substring(1, value.length() - 1)
        }
    }
    return value
}

android {
    signingConfigs {
        release {
            // Keystore credentials come from environment, gradle.properties, or local.properties
            def storeFilePath = getSecretProperty("KEYSTORE_FILE")
            def storeFileObj = storeFilePath ? file(storeFilePath) : null
            if (storeFileObj != null && storeFileObj.exists()) {
                storeFile storeFileObj
                storePassword getSecretProperty("KEYSTORE_PASSWORD")
                keyAlias getSecretProperty("KEY_ALIAS")
                keyPassword getSecretProperty("KEY_PASSWORD")
            }
        }
    }

